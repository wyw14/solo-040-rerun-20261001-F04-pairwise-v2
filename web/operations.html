<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Operations</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body>
<header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a aria-current="page" href="/operations">Operations</a><a href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main>
  <div class="page-title"><div><h1>Dispatch operations</h1><div class="muted">Active convoy and admission control</div></div><span class="status" id="health">Connecting</span></div>
  <div class="grid">
    <section class="panel"><h2>Create convoy plan</h2><form id="plan-form">
      <div class="form-row"><div><label for="chamber">Chamber</label><select id="chamber"><option>chamber-1</option><option>chamber-2</option></select></div><div><label for="direction">Direction</label><select id="direction"><option value="upstream">Upstream</option><option value="downstream">Downstream</option></select></div><div><label for="length">Length (m)</label><input id="length" type="number" value="86" min="1"></div></div>
      <div class="form-row"><div><label for="vessel">Vessel</label><input id="vessel" value="River Star"></div><div><label for="call-sign">Call sign</label><input id="call-sign" value="RS-204"></div><div><label>&nbsp;</label><button type="submit">Create and admit</button></div></div>
      <div class="message" id="plan-message"></div>
    </form></section>
    <section class="panel"><h2>Current transit</h2><div class="metrics"><div class="metric">Chamber<strong id="metric-chamber">-</strong></div><div class="metric">Stage<strong id="metric-stage">-</strong></div><div class="metric">Cycle<strong id="metric-cycle">-</strong></div></div></section>
    <section class="panel wide"><h2>Active plans</h2><table><thead><tr><th>Chamber</th><th>Plan</th><th>Direction</th><th>Vessels</th><th>Signal publication</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="plans"></tbody></table></section>
  </div>
</main><script src="/assets/app.js"></script><script src="/assets/operations.js"></script>
</body></html>
